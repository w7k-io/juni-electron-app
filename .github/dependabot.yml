version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Patches and minors are grouped: low risk, mergeable as one batch.
      # Majors deliberately stay OUT of the group so each one arrives as its
      # own PR and is judged on its merits. Grouping everything produced PRs
      # of 13+ packages where a single peer conflict blocked the whole batch —
      # security patches included. Cf JUNI-1199.
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    ignore:
      - dependency-name: "typescript"
        # TypeScript 7 breaks resolution: ts-jest declares peer ">=4.3 <7".
        # Revisit once ts-jest supports TS 7 — the bump is unusable until then.
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        # Must always track the Node runtime major (see .nvmrc / engines).
        # Dependabot drifted these types to 25.x on a Node 22 runtime, typing
        # the code against APIs absent at execution. Bump manually, together
        # with the runtime. Cf JUNI-1181.
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
