# SonarCloud Configuration
sonar.organization=w7k-io
sonar.projectKey=w7k-io_juni-electron-app
sonar.host.url=https://sonarcloud.io

# Source directories
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# TypeScript coverage (LCOV from Jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/out/**,**/coverage/**

# Coverage exclusions
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/test/**
