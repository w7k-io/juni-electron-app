name: Electron Pipeline

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (optionnel, auto-calculée si vide)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/**'
  pull_request:
    branches: [main]

jobs:
  # ========================================
  # ÉTAPE 0: Sécurité (Trivy fs + Semgrep SAST) — bloquant sur PR
  # ========================================
  security-trivy:
    name: 🛡️ Security — Trivy (deps + secrets + misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Trivy filesystem scan (vuln + secret + misconfig) — CRITICAL/HIGH bloquant
        # Pinned to commit SHA per Codacy/Opengrep third-party-action-not-pinned-to-commit-sha (v0.36.0)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: 'true'
          scanners: 'vuln,secret,misconfig'
          skip-dirs: 'node_modules,dist,out,electron-dist'

  security-semgrep:
    name: 🛡️ Security — Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.161.0
    steps:
      - uses: actions/checkout@v6

      - name: Run Semgrep — ERROR bloquant
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --severity ERROR \
            --error \
            --metrics off \
            .

  # ========================================
  # ÉTAPE 1: Build Electron (avec tests intégrés)
  # ========================================
  build:
    name: Build
    needs: [security-trivy, security-semgrep]
    uses: ./.github/workflows/electron-build.yml
    with:
      version: ${{ github.event.inputs.version || '' }}
    secrets: inherit

  # ========================================
  # ÉTAPE 2: Tests E2E macOS (main uniquement)
  # ========================================
  test-e2e:
    name: E2E Tests
    needs: [build]
    if: ${{ github.event_name != 'pull_request' }}
    uses: ./.github/workflows/test-e2e-macos.yml
    with:
      artifact_name: juni-electron-macos
    secrets: inherit

  # ========================================
  # ÉTAPE 3: Release GitHub (main uniquement)
  # ========================================
  release:
    name: Release
    needs: [build, test-e2e]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/release-github.yml
    with:
      version: ${{ needs.build.outputs.version }}
      artifact_name: juni-electron-macos
    secrets: inherit

  # ========================================
  # ÉTAPE 4: Résumé final
  # ========================================
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [build, test-e2e, release]
    if: always()

    steps:
      - name: Pipeline Summary
        run: |
          echo "======================================"
          echo "RÉSUMÉ DE LA PIPELINE"
          echo "======================================"
          echo ""
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "Étapes:"
          echo "  1. Build: ${{ needs.build.result }}"
          echo "  2. Tests E2E: ${{ needs.test-e2e.result }}"
          echo "  3. Release: ${{ needs.release.result }}"

          echo ""

          E2E_RESULT="${{ needs.test-e2e.result }}"
          if [[ "${{ needs.build.result }}" == "success" && \
                ("$E2E_RESULT" == "success" || "$E2E_RESULT" == "skipped") ]]; then
            echo "PIPELINE RÉUSSIE!"
            echo ""
            echo "  - Version: ${{ needs.build.outputs.version }}"

            if [[ "${{ needs.release.result }}" == "success" ]]; then
              echo "  - Release: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.build.outputs.version }}"
              echo "  - Auto-update: actif via update.electronjs.org"
            elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
              echo ""
              echo "  PR - Pas de release. Artifacts disponibles 7 jours."
            fi
          else
            echo "PIPELINE ÉCHOUÉE"
            echo "Vérifiez les étapes en échec ci-dessus."
            exit 1
          fi
