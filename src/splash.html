<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kagron</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #245281;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e0e0e0;
      -webkit-app-region: drag;
      user-select: none;
      overflow: hidden;
    }

    .logo {
      width: 120px;
      height: auto;
      margin-bottom: 64px;
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.2s forwards;
    }

    .spinner {
      width: 160px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeInOpacity 0.6s ease-out 0.5s forwards;
      overflow: hidden;
    }

    .spinner::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 2px;
      animation: slide 1.5s ease-in-out infinite;
    }

    .status {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.5px;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .error-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .error-message {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      text-align: center;
      max-width: 400px;
      line-height: 1.5;
    }

    .retry-btn {
      -webkit-app-region: no-drag;
      padding: 8px 24px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .retry-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInOpacity {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slide {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(300%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>
  <!-- JUNI-918 — splash logo (Kagron K, refresh 2026) -->
  <svg class="logo" viewBox="0 0 311 351" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M154.991 154.237L311 350.342H234L113.5 201L77.5 241.267L0 328V241.267L108.321 118.582L108.282 118.561L211.553 0H293.068L154.991 154.237Z" fill="#B9975B"/>
    <path d="M67.3752 119.784L0 196.093V0H67.3752V119.784Z" fill="#B9975B"/>
  </svg>
  <div class="spinner"></div>
  <div class="status" id="status"></div>

  <div class="error-container" id="error">
    <div class="error-message" id="error-message">
      Impossible de se connecter au serveur Kagron.
    </div>
    <button class="retry-btn" id="retry-btn">Reessayer</button>
  </div>

  <script>
    const messages = [
      'Enfilage du short...',
      'Repassage du maillot...',
      'Démêlage des chaussettes...',
      'Laçage des chaussures...',
      'Application de la résine...',
      'Échauffement des épaules...',
      'Vérification du tableau de marque...',
      'Gonflage du ballon...',
      'Coup de sifflet imminent...',
    ];

    const statusEl = document.getElementById('status');
    let index = 0;

    function showMessage() {
      statusEl.style.opacity = '0';
      statusEl.style.transform = 'translateY(4px)';
      setTimeout(() => {
        statusEl.textContent = messages[index];
        statusEl.style.opacity = '1';
        statusEl.style.transform = 'translateY(0)';
        index = (index + 1) % messages.length;
      }, 200);
    }

    // First message after initial fade-in delay
    setTimeout(showMessage, 800);
    setInterval(showMessage, 4000);
  </script>
</body>
</html>
