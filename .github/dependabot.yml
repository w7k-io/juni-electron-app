version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Patches and minors are grouped: low risk, mergeable as one batch.
      # Majors deliberately stay OUT of the group so each one arrives as its
      # own PR and is judged on its merits. Grouping everything produced PRs
      # of 13+ packages where a single peer conflict blocked the whole batch —
      # security patches included. Cf JUNI-1199.
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    ignore:
      - dependency-name: "typescript"
        # TypeScript 7 breaks resolution: ts-jest declares peer ">=4.3 <7".
        # Revisit once ts-jest supports TS 7 — the bump is unusable until then.
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        # Must track the Node major EMBEDDED BY ELECTRON, not the build Node:
        # main process and preload run on Electron's own Node. Read it from the
        # electron devDependency, not from .nvmrc — Electron 43 ships Node 24.18
        # while the build still runs on 22. Bump manually, together with the
        # electron major. Cf JUNI-1181.
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
