name: Test Components (Reusable)

on:
  workflow_call:
    outputs:
      tests_passed:
        description: "Indique si tous les tests sont passés"
        value: ${{ jobs.test-summary.outputs.all_passed }}

jobs:
  unit-tests:
    name: Unit Tests Jest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build:ts

      - name: Run Jest Tests
        run: |
          echo "Tests unitaires Jest..."
          npx jest --passWithNoTests --ci --coverage --watchAll=false
        env:
          CI: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage/
          retention-days: 7

      - name: Upload coverage to Codacy
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          # Un jeton de COMPTE ne designe aucun projet : sans ces trois lignes, le reporter
          # construit une URL invalide et l'envoi echoue en 404 ("Request URL not found"),
          # alors que le rapport a bien ete trouve et parse. Un jeton de PROJET s'en passerait,
          # mais il en faudrait un par depot. Cf .claude/rules/codacy-setup.md.
          organization-provider: gh
          username: w7k-io
          project-name: juni-electron-app
          coverage-reports: coverage/lcov.info

  test-summary:
    name: Tests Summary
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: always()
    outputs:
      all_passed: ${{ steps.check.outputs.all_passed }}

    steps:
      - name: Check test results
        id: check
        run: |
          echo "Resume des tests:"
          echo "  - Unit Tests: ${{ needs.unit-tests.result }}"

          if [[ "${{ needs.unit-tests.result }}" == "success" ]]; then
            echo "Tous les tests sont passes!"
            echo "all_passed=true" >> $GITHUB_OUTPUT
          else
            echo "Certains tests ont echoue"
            echo "all_passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi
